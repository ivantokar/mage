name: CI

# A pull request runs Linux with the current toolchain. A push to a release branch also
# runs the Swift 6.0 baseline and macOS; a tag or a manual run builds the whole matrix.
# The single required check is `CI complete`: a skipped job counts as passing, a failed
# or cancelled one does not. Documentation-only changes and drafts skip the build jobs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - "release/**"
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          baseline='{"name":"baseline","swift":"6.0","distro":"jammy"}'
          current='{"name":"current","swift":"6.4","distro":"noble"}'
          case "${{ github.event_name }}" in
            pull_request) echo "linux=[$current]" >> "$GITHUB_OUTPUT"; echo "macos=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "linux=[$baseline,$current]" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          # Documentation-only: every changed path is Markdown, a licence or an image.
          if echo "$changed" | grep -vE '(^|/)[^/]+\.md$|^LICENSE$|\.png$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    name: Linux ${{ matrix.name }} (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true' && !github.event.pull_request.draft
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  complete:
    name: CI complete
    if: always()
    needs: [changes, lint-workflows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
