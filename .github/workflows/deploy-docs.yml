name: Deploy Docs to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docs-deploy-mage
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      MAGE_DOCS_DOMAIN_NAME: ${{ vars.MAGE_DOCS_DOMAIN_NAME }}
      MAGE_DOCS_SUBDOMAIN: ${{ vars.MAGE_DOCS_SUBDOMAIN }}
      MAGE_DOCS_HOSTED_ZONE_ID: ${{ vars.MAGE_DOCS_HOSTED_ZONE_ID }}
      MAGE_DOCS_GITHUB_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install CDK dependencies
        run: npm install --prefix cdk

      - name: Build VitePress documentation
        run: npm run docs:build

      - name: Verify build output
        run: ls -la docs/.vitepress/dist/

      - name: Validate AWS role secret
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Missing repository secret AWS_ROLE_ARN. See cdk/README.md#4-configure-github-actions"
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::AWS_ROLE_ARN must be an IAM role ARN (example: arn:aws:iam::123456789012:role/GitHubActionsRole)"
            exit 1
          fi

      - name: Validate docs deployment configuration
        run: |
          if [ -z "$MAGE_DOCS_DOMAIN_NAME" ]; then
            echo "::error::Missing repository variable MAGE_DOCS_DOMAIN_NAME (example: ivantokar.com)"
            exit 1
          fi
          if [ -z "$MAGE_DOCS_HOSTED_ZONE_ID" ]; then
            echo "::error::Missing repository variable MAGE_DOCS_HOSTED_ZONE_ID (example: Z1234567890ABC)"
            exit 1
          fi
          if [ -z "$MAGE_DOCS_SUBDOMAIN" ]; then
            echo "::notice::MAGE_DOCS_SUBDOMAIN not set. CDK default 'mage' will be used."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Synth
        run: npm run synth --prefix cdk

      - name: CDK Deploy
        run: npm run deploy --prefix cdk -- --require-approval never

      - name: Output deployment note
        run: 'echo "Documentation deployed. Check CloudFormation output MageDocsWebsiteURL for the exact URL."'
